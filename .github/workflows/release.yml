name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry-run version label (no GitHub Release is published on manual dispatch)"
        required: false
        default: "v0.0.0-dryrun"

permissions:
  contents: write

jobs:
  test:
    name: verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - name: build binaries
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: bash scripts/build-release.sh "${{ matrix.target }}" dist/release
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: generate SHA256SUMS.txt
        working-directory: dist/release
        run: |
          sha256sum *.tar.gz | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS.txt
